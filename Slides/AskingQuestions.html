### Has the level of racism in the US changed over time?

---

&lt;img src="images/Sears1.png" alt="Citation: Sears et al. (1997), 'Is It Really Racism? The Origins of White Americans' Opposition to Race-Targeted Policies,' Public Opinion Quarterly 61(1), pp. 16-53." width="90%" style="display: block; margin: auto;" /&gt;

---
&lt;img src="images/Sears2.png" alt="Sears et al. excerpt: old-fashioned racism (Jim Crow era) focused on biological superiority and legalized segregation; variously called 'redneck racism,' 'blatant racism,' or 'classical racism.'" width="90%" style="display: block; margin: auto;" /&gt;

---
&lt;img src="images/Sears3.png" alt="Sears et al. excerpt: stereotypes of Black people as lazy, unintelligent, and morally depraved have long been common in American society and used as predictors of policy and candidate preferences." width="90%" style="display: block; margin: auto;" /&gt;

---
&lt;img src="images/Sears4.png" alt="Sears et al. excerpt: negative affect toward African Americans as a group has been measured using the NES 'feeling thermometer' and treated as the simplest index of racial prejudice." width="90%" style="display: block; margin: auto;" /&gt;

---
&lt;img src="images/Sears5.png" alt="Sears et al. excerpt: despite declining old-fashioned racism, a 'new racism' has emerged; scholars describe it variously as symbolic racism, modern racism, subtle racism, racial resentments, ambivalent racism, aversive racism, and laissez-faire racism." width="90%" style="display: block; margin: auto;" /&gt;

---
&lt;img src="images/Sears6.png" alt="Sears et al. excerpt: group position theory, realistic group conflict theory, and social dominance theory share the assumption that attachment to a hegemonic in-group drives opposition to groups aspiring to equality." width="90%" style="display: block; margin: auto;" /&gt;

---
&lt;img src="images/Sears7.png" alt="Sears et al. Table 1: regression results predicting whites' opposition to equal opportunity for Blacks using 1986 and 1992 NES data. Symbolic racism is the strongest predictor (Beta=0.40 in 1986, 0.35 in 1992), with social welfare ideology also significant." width="90%" style="display: block; margin: auto;" /&gt;

---
&lt;img src="images/Rucker1.png" alt="Rucker and Richeson (2021), 'Toward an Understanding of Structural Racism: Implications for Criminal Justice,' Science 374(6565), pp. 286-290." width="90%" style="display: block; margin: auto;" /&gt;

---
&lt;img src="images/Rucker2.png" alt="Rucker and Richeson Figure 1A: declining self-reports of racial prejudice among white Americans from 1972 to 2008 across four survey items (home seller discrimination, laws against intermarriage, right to segregate neighborhood, school segregation)." width="90%" style="display: block; margin: auto;" /&gt;

---
&lt;img src="images/Rucker3.png" alt="Rucker and Richeson Figure 1B: rising prison admission and imprisonment rates for Black Americans (orange) vs. white Americans (blue) from the 1920s to 2010, showing a dramatic increase beginning around 1980." width="90%" style="display: block; margin: auto;" /&gt;

---
&lt;img src="images/quilliantitle.JPG" alt="Quillian et al. (2017), 'Meta-analysis of Field Experiments Shows No Change in Racial Discrimination in Hiring over Time,' PNAS — title page." width="90%" style="display: block; margin: auto;" /&gt;

---
&lt;img src="images/resumetime.JPG" alt="Quillian et al. Figure 1: scatter plot of callback ratio (white/Black applicants) across resume audit studies by fieldwork year, 1972-2016. The trend line is essentially flat, showing no reduction in hiring discrimination over time." width="90%" style="display: block; margin: auto;" /&gt;

---
&lt;img src="images/Bertrand1.png" alt="Bertrand and Mullainathan (2004), 'Are Emily and Greg More Employable Than Lakisha and Jamal? A Field Experiment on Labor Market Discrimination,' American Economic Review 94(4), pp. 991-1013." width="90%" style="display: block; margin: auto;" /&gt;

---
&lt;img src="images/Bertrand2.png" alt="Bertrand and Mullainathan: African-American-sounding names increase the likelihood of a callback by 0.54 percentage points less than white-sounding names; applicants in whiter, more educated zip codes are helped relatively more by having a white-sounding name." width="90%" style="display: block; margin: auto;" /&gt;

---
&lt;img src="images/Bertrand3.png" alt="Bertrand and Mullainathan Table 8: callback rates and mothers' education by first name, separately for white-male, white-female, Black-male, and Black-female names. Average callback rate is 9.65% for white names vs. 6.45% for Black names." width="90%" style="display: block; margin: auto;" /&gt;

---
&lt;img src="images/Kline.png" alt="Kline et al. (2022), 'Systemic Discrimination Among Large U.S. Employers,' Quarterly Journal of Economics: a correspondence experiment finds mean contact gaps of 1.3 percentage points favoring white over Black applicants, with firms in the top quintile of discrimination accounting for nearly half the gap." width="50%" style="display: block; margin: auto;" /&gt;

---
&lt;img src="images/Brown1.png" alt="Brown (2013), 'Race, Legality, and the Social Policy Consequences of Anti-Immigration Mobilization,' American Sociological Review 78(2), pp. 290-314 — title page." width="70%" style="display: block; margin: auto;" /&gt;

---
&lt;img src="images/Brown2.png" alt="Brown Figure 1: diagram of categories of worth in the legality and racial frames. Legality frame: legal immigrants are worthy, illegal immigrants unworthy. Racial frame: white American citizens are worthy, Hispanics unworthy; illegal Hispanic immigrants sit at the intersection." width="70%" style="display: block; margin: auto;" /&gt;

---
&lt;img src="images/Brown3.png" alt="Brown Table 1: comparison of welfare reform policies and demographic characteristics of Arizona and California in 1996. Arizona adopted stricter work requirements, shorter time limits, full-family sanctions, and denial of noncitizen benefits; California did not." width="70%" style="display: block; margin: auto;" /&gt;

---
&lt;img src="images/Brown4.png" alt="Brown excerpt: politician Pete Wilson using the legality frame — arguing that illegal immigration harms legal immigrants and hardworking citizens, framing the issue around lawfulness rather than race." width="70%" style="display: block; margin: auto;" /&gt;

---
&lt;img src="images/Brown5.png" alt="Brown excerpt: politician Tom McClintock using the racial frame — invoking 'Mexicans,' southern border hemorrhage, and protecting 'our land, our resources, and our hard-earned tax dollars,' framing immigration as a racial and economic threat." width="70%" style="display: block; margin: auto;" /&gt;

---
### How Brown Built Her Argument

Data:

* 500 newspaper stories (coded for racial and legal language)

* 600+ pages of archival documents (legislative testimonies, committee minutes, press releases)

* 17 interviews with key policymakers and advocates

---
### How Brown Built Her Argument

Analytic strategy:

* Compared two similar states with different outcomes (paired comparison)

* Traced how frames from immigration debates carried over into welfare debates

* Looked for patterns in how people talked about immigrants and welfare recipients

---
### How Brown Built Her Argument

Result: Not just a few quotes, but systematic evidence that California and Arizona developed different ways of talking about immigrants—and those differences shaped policy.

---

### How do we make sense of all of this?

---

There is a complex and probably multifaceted reality behind these studies, but they also vary in *how* they are approaching that reality.

* Quantitative: patterns
* Experimental: causes
* Qualitative: processes

---
### Our Goals

1. Understand and critically read how social scientists use methods

2. Have hands-on experience using key methods in structured, guided ways

3. Identify stronger and weaker methodological arguments in empirical social science, and explain what makes the difference
