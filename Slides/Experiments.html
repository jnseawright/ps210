### Today's Goals

By the end of this session, you should be able to:

1. Explain how random assignment addresses the fundamental problem of causal inference
2. Define internal validity and external validity and describe major threats to each
3. Apply a design checklist to evaluate whether an experiment's results are trustworthy
4. Distinguish lab experiments, field experiments, and survey experiments, and explain when each is appropriate

---
### Experiments

-   The fundamental problem of causal inference is that we can't compare
    a world with the cause to a world without the cause.

-   But if we take two large random samples, we know they are pretty
    much the same as each other.


---
### In-Class Example

How can we randomize the class, right now?

---
### Experiments

-   So, we can apply the cause to one group but not the other.


---
### Experiments

-   There are two prerequisites:

    -   We need to be able to take two large random samples of
        independent cases.

    -   We need to be able to manipulate the cause that we're interested
        in.


---
### Example: Do Media Retractions Work?

&lt;img src="images/Freitag1.PNG" alt="Freitag et al. (2024), 'The Corrections Dilemma: Media Retractions Increase Belief Accuracy But Decrease Trust,' Journal of Experimental Political Science 11, pp. 90–101. Authors: Joshua Freitag, Madeline Gochee, Mitchell Ransden, Brendan Nyhan, Kristy Roschke, and Dan Gillmor." width="90%" style="display: block; margin: auto;" /&gt;


---

&lt;img src="images/Freitag2.PNG" alt="Freitag et al. Figure 1: survey flow diagram. Participants complete baseline measures, then see a Twitter feed with a false tweet and four neutral tweets, then answer pre-treatment measures. They are then randomly assigned to one of five conditions: no correction, news outlet correction, third-party correction, both corrections (news first), or both corrections (third-party first). Finally, all participants answer post-treatment measures on false belief, news outlet trust, and political efficacy." width="90%" style="display: block; margin: auto;" /&gt;


---

&lt;img src="images/Freitag3.PNG" alt="Freitag et al. Figure 2: dot plot of treatment effects on belief accuracy (red) and news outlet trust (blue) across four correction conditions. All four conditions significantly increase belief accuracy (positive effects above the dashed zero line). All four conditions decrease news outlet trust (negative effects), illustrating the 'corrections dilemma': corrections work, but at a cost to trust in the media outlet that issues them." width="90%" style="display: block; margin: auto;" /&gt;


---
### What do we need to assume for the previous slide's results to be causal?

---
### Causal Inference with Experiments

-   Measure the dependent variable somehow.

-   Look for a difference on the dependent variable between the
    treatment group and the control group or between different treatment
    groups.


---
### Evaluating Causal Inferences

-   Internal validity: does the treatment seem to cause the dependent
    variable for the cases under study?

-   External validity: does the causal claim in question seem to
    generalize appropriately to the desired population, and does the
    experiment seem to capture the desired concepts?


---
### Internal Validity

-   As long as the randomization procedure was done correctly, an
    experiment always ranks high on internal validity.


---
### External Validity

-   Most experiments are much weaker on external validity than they are
    on internal validity.

    -   The subjects for an experiment may not be a random sample of the
        relevant population.

    -   The experimental treatment may differ from the real-world
        independent variable.

    -   Our descriptive inferences about the dependent variable may not
        be done well.


---
### Questions to Ask about Experiments

To figure out about internal validity (AKA confounding variables,
whether causation moves in the right order), ask:

1.  Was the treatment randomly assigned?

2.  Was the sample size large?

3.  Was treatment compliance pretty good?

4.  Was there evidence of fraud, manipulation, or other failures?

---
### Questions to Ask about Experiments

To figure out about external validity (AKA whether we can generalize to
the population of interest), ask:

1.  Is the set of experimental subjects representative of the population
    of interest?

2.  Is the experimental treatment similar enough to the independent
    variable in the theory?
    
3.  Is the dependent variable measured well enough?

---
### Three Types of Experiments

1.  Lab Experiment: Carefully controlled, structured environment in which treatments and outcomes are administered usually in person
2.  Field Experiment: Real-world intervention in which a treatment is administered at random to treatment and control groups
3.  Survey Experiment: Experiments in which treatments are administered usually through digital devices as part of a survey 
---
### Back to a Question from October 1

On Oct. 1 we saw that gender quotas work; Bhavnani's Mumbai lottery showed women kept winning after reservations were withdrawn.

But we left a question open: **why** weren't women winning without quotas?

- **Supply:** women aren't recruited or nominated
- **Demand:** voters penalize women candidates

Each of the three experiment types gives us a different angle on this.

---
### A Field Experiment on Electing Women

&lt;img src="images/karpowitz_title.png" alt="Karpowitz, Monson &amp;amp; Preece (2017), 'How to Elect More Women: Gender and Candidate Success in a Field Experiment,' AJPS. Abstract: a field experiment in 1,842 Utah Republican caucus precincts tests supply (encourage women to run) and demand (encourage voters to support women) interventions; both supply and demand treatments increase women's election as delegates, especially combined." width="85%" style="display: block; margin: auto;" /&gt;

---

Karpowitz, Monson &amp; Preece (2017) randomly assigned Utah Republican caucus precincts to one of four conditions:

- **Control:** no intervention
- **Supply:** messages encouraging women to run as delegates
- **Demand:** messages from party leaders encouraging voters to support female candidates
- **Supply + Demand:** both interventions combined

Note what makes this a *field* experiment: real caucuses, real delegates, real party letters.

---

&lt;img src="images/karpowitz_outcome.png" alt="Karpowitz et al. Figure 2: proportion of precincts electing at least one woman as state delegate by condition. Control ~38%, Supply ~44%, Demand ~44%, Supply+Demand ~46%. All treatment conditions are higher than control with overlapping 95% confidence intervals." width="70%" style="display: block; margin: auto;" /&gt;

---

&lt;img src="images/karpowitz_outcome_2.png" alt="Karpowitz et al. Figure 3: estimated proportion of state delegates who are women by condition. Control ~24%, Supply ~26%, Demand ~27%, Supply+Demand ~30%. The Supply+Demand condition shows the largest gain, with confidence intervals not overlapping the control." width="70%" style="display: block; margin: auto;" /&gt;

---

Both supply and demand interventions raised women's representation. Combined, they worked best.

So it isn't only a pipeline problem: **voter demand matters too**, and simple party-leader messages can move it.

Random assignment means we can trust these are causal effects.

---
### But Do Voters Actually Penalize Women?

Karpowitz shows demand *can be moved*. That's not the same as showing voters are biased to begin with.

For that we need a different design. Here the three experiment types disagree.

---
### Survey Experiments (Schwarz &amp; Coppock 2022)

&lt;img src="images/schwarz_title.png" alt="Schwarz &amp;amp; Coppock (2022), 'What Have We Learned about Gender from Candidate Choice Experiments? A Meta-Analysis of Sixty-Seven Factorial Survey Experiments,' JOP. Abstract: pooling 67 conjoint/vignette studies, the average effect of female candidate gender is a gain of approximately 2 percentage points; voter preferences are not a major factor explaining women's underrepresentation." width="85%" style="display: block; margin: auto;" /&gt;

---

&lt;img src="images/schwarz_results.png" alt="Schwarz &amp;amp; Coppock Figure 1: forest plot of AMCE estimates for female candidate gender across 67 studies. Each row is one study; most estimates cluster near or slightly above zero (slight advantage for women), confirming no systematic voter penalty for female candidates." width="55%" style="display: block; margin: auto;" /&gt;

---

Each row is one of 67 survey experiments. Most estimates cluster near zero, or slightly *positive* for women.

Average effect of being a female candidate: **+2 percentage points**.

On this evidence, voters don't penalize women at all.

---
### A Natural Experiment in Real Elections (Eyméoud &amp; Vertier 2023)

&lt;img src="images/eymeoud_title.png" alt="Eyméoud &amp;amp; Vertier (2023), 'Gender Biases: Evidence from a Natural Experiment in French Local Elections,' Economic Policy. A 2015 reform required gender-balanced candidate pairs; alphabetical ordering determined which gender appeared first on the ballot, creating an as-if random treatment." width="75%" style="display: block; margin: auto;" /&gt;

---

A 2015 French reform required gender-balanced candidate pairs. **Alphabetical ordering** determined which gender appeared first on the ballot, so it was effectively random.

&lt;img src="images/eymeoud_treatment.png" alt="Eyméoud &amp;amp; Vertier Figure 1: examples of valid French local election ballots showing three layout variants. Each ballot lists a main candidate and a substitute (remplaçant/e); candidate order varies by alphabetical name ordering, providing the natural experiment variation." width="85%" style="display: block; margin: auto;" /&gt;

---

&lt;img src="images/eymeoud_results.png" alt="Eyméoud &amp;amp; Vertier regression results: effect of 'Woman first' on ballot by voter ideology (XLeft, Left, Right, XRight). The penalty is statistically significant only among right-leaning voters (Right column: -1.397**, p=0.016). Left-leaning and far-right voters show no significant effect." width="85%" style="display: block; margin: auto;" /&gt;

---

The "Woman first" penalty is significant only in the **Right** column (−1.4pp\*\*).

Right-leaning voters penalized women who appeared first. Left-leaning voters did not.

And the bias shrinks where newspaper circulation is higher: more information, less discrimination.

---
### Two Designs, Two Answers. Which Do We Believe?

**Survey experiments** (Schwarz &amp; Coppock): no penalty, slight advantage for women.

**Real elections** (Eyméoud &amp; Vertier): a small penalty among right-leaning voters.

Both are well-identified. So why do they disagree?

---
### This Is an External Validity Problem

Recall our three external validity questions:

1. **Are the subjects representative?** Survey samples skew toward the attentive and online.

2. **Is the treatment similar to the real-world variable?** A conjoint table presents two candidates side by side with full information. A real ballot gives you names and almost nothing else.

3. **Is the outcome measured well?** Clicking a preferred profile is not casting a vote.

---
### This Is an External Validity Problem


The survey experiments have excellent *internal* validity. The gap is in generalizing to a low-information ballot.

---
### What We Can Now Say

Voter discrimination is **real, narrow, and context-dependent**, concentrated among right-leaning voters, and reducible by information.

It is not the primary bottleneck. Supply and party behavior matter more.

Note how we got here: no single experiment answered the question. The answer came from **reading designs against each other**.
