# Part 1: R Basics

---
### Getting Oriented

**R** does the calculations. **RStudio** is where we write and run code.

Four panes:
- **Source** (top left): where you write scripts
- **Console** (bottom left): where code runs
- **Environment** (top right): shows your data
- **Files/Plots/Help** (bottom right): where plots appear

---
### Loading Data with `read.csv()`


``` r
# Read data from a URL
qog_small &lt;- read.csv("https://github.com/jnseawright/ps210/raw/refs/heads/main/Data/qogsmall.csv")

# Read data from your computer (after downloading)
# local_data &lt;- read.csv("path/to/your/file.csv")
```

**Key points:**
- `&lt;-` is the assignment operator (saves data to a name)
- File paths matter! Use forward slashes `/` even on Windows

### Today's Example Data

We'll use fake data about immigration arrests (similar to Homework 1, but different):

# Arrests data (each row is one arrest)

```

---
### Merging Datasets: The Loop Approach

Homework 1 uses a loop. Let's understand what it does:


``` r
# Create empty variable
arrests$Party &lt;- NA

# Loop through each arrest
for (i in 1:nrow(arrests)) {
  # Find which state this arrest happened in
  this_state &lt;- arrests$state[i]
  
  # Look up that state's party in the states dataset
  party_value &lt;- states$party[states$state == this_state]
  
  # Assign it to the arrest
  arrests$Party[i] &lt;- party_value
}
```

---
### A Simpler Alternative: `left_join()`

The `tidyverse` gives us a cleaner way:


``` r
arrests &lt;- left_join(arrests, states, by = "state")
```

This does the same thing as the loop, but in one line!

- Takes `arrests`, adds variables from `states`
- Matches rows where the `state` column is the same
- Keeps all rows in `arrests` (even if no match)

---
### Check Your Work

```

---
### Creating New Variables

We can create new variables based on existing ones:


``` r
# Create a variable indicating large states
arrests$large_state &lt;- arrests$population &gt; 5000000

# Create a categorical variable from a numeric one
arrests$pop_category &lt;- cut(arrests$population,
                           breaks = c(0, 1000000, 5000000, 10000000, Inf),
                           labels = c("Very Small", "Small", "Medium", "Large"))
```

# Part 3: Visualization (15 min)

---
### Bar Plot of Arrests by Party


``` r
# Simple count by party
ggplot(arrests, aes(x = Party)) +
  geom_bar() +
  labs(title = "ICE Arrests by Governor's Party",
       x = "Party of Governor",
       y = "Number of Arrests") +
  theme_minimal()
```

---
### Bar Plot with Two Variables

To show arrests by party *and* population category:


``` r
# First, create population categories
arrests &lt;- arrests %&gt;%
  mutate(pop_group = cut(population,
                        breaks = quantile(population, probs = seq(0, 1, 0.2), na.rm = TRUE),
                        labels = c("Very Small", "Small", "Medium", "Large", "Very Large"),
                        include.lowest = TRUE))

# Now plot
ggplot(arrests, aes(x = pop_group, fill = Party)) +
  geom_bar(position = "dodge") +
  labs(title = "Arrests by State Population and Governor's Party",
       x = "State Population Group",
       y = "Number of Arrests",
       fill = "Party") +
  scale_fill_manual(values = c("blue", "red")) +
  theme_minimal() +
  theme(axis.text.x = element_text(angle = 45, hjust = 1))
```

---
### What Does This Plot Tell Us?

Look at the plot and discuss:

- In which population groups are arrests more common?
- Does the party difference look the same across all groups?
- What are the *limitations* of this plot?

**Limitations to discuss:**
- Raw counts, not rates per capita
- Doesn't account for other state differences
- Can't tell us about cause and effect

---
### Visualizing Rates Instead of Counts

Sometimes a rate is more informative:


``` r
# Calculate arrests per 100,000 residents
arrests &lt;- arrests %&gt;%
  mutate(arrest_rate = 100000 / population)

# Now we'd need to aggregate by state first...
# (More complex—we'll save this for later)
```
