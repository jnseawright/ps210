---
### Merge and Count (Tidyverse Version)


``` r
# Harmonize RTV country names to QOG's spellings before counting
rtv &lt;- rtv %&gt;%
  mutate(country_name = recode(country_name,
    "Netherlands"    = "Netherlands (the)",
    "United Kingdom" = "United Kingdom of Great Britain and Northern Ireland (the)"
  ))

# Count incidents per country‑year
event_counts &lt;- rtv %&gt;%
  group_by(country_name, year) %&gt;%
  summarise(violence_count = n(), .groups = "drop")

# Join to QOG
qog_merged &lt;- left_join(qog_small, event_counts,
                        by = c("cname" = "country_name", "year" = "year"))

# Replace NA with 0 (no violence)
qog_merged$violence_count[is.na(qog_merged$violence_count)] &lt;- 0

# Keep only countries that appear in RTV (optional)
qog_merged &lt;- qog_merged %&gt;% filter(cname %in% event_counts$country_name)
```

# Part 2: Bivariate Regression

---
### Research Question

Does right‑wing violence affect the level of democracy?

**Hypothesis:** Countries with more right‑wing violence have lower democracy scores.

---
### Visualize the Relationship


``` r
bivarplot &lt;- ggplot(qog_merged, aes(x = democracy, y = violence_count)) +
  geom_point(alpha = 0.3) +
  geom_smooth(method = "lm", color = "red") +
  labs(title = "Right-Wing Violence by Democracy",
       y = "Number of violent incidents",
       x = "Democracy score") +
  theme_minimal()
```

---


``` r
bivarplot
```

![](StatisticalComputingLabSession2_files/figure-html/unnamed-chunk-9-1.png)&lt;!-- --&gt;

---

**Discuss:** What do you see? Any issues? (Skew, outliers)

---
### Log Transformation

Because violence is highly skewed, we often use `log(1 + violence)`.


``` r
qog_merged &lt;- qog_merged %&gt;%
  mutate(log_violence = log(1 + violence_count))

logbivarplot &lt;- ggplot(qog_merged, aes(x = democracy, y = log_violence)) +
  geom_point(alpha = 0.3) +
  geom_smooth(method = "lm", color = "red") +
  labs(title = "Democracy by Logged Right-Wing Violence",
       y = "Log(1 + violence)",
       x = "Democracy score") +
  theme_minimal()
```

---


``` r
logbivarplot
```

![](StatisticalComputingLabSession2_files/figure-html/unnamed-chunk-11-1.png)&lt;!-- --&gt;

---
### Fit the Bivariate Regression


``` r
model1 &lt;- lm(log_violence ~ democracy, data = qog_merged)
summary(model1)
```

# Part 3: Multivariate Regression

---
### The Problem of Confounding

Democracy might be correlated with other factors that also affect violence, e.g., **economic development** (per capita GDP).

Let's add `percapitagdp` as a control.

---
### Check the Control Variable


``` r
summary(qog_merged$percapitagdp)
```

```
##    Min. 1st Qu.  Median    Mean 3rd Qu.    Max.    NA's 
##    3135   19019   29350   33602   43259  112418     264
```

Some missing values. We'll need to handle them. For now, `lm()` will drop rows with NA in any variable in the model.

---
### Same Sample for Both Models

`lm()` silently drops any row with a missing value in the outcome or a predictor. GDP is missing more often than democracy, so the multivariate model would use fewer country-years than the bivariate model.

To compare coefficients fairly, we fit both models on the same complete-case sample.

---


``` r
qog_analysis &lt;- qog_merged %&gt;%
  filter(!is.na(democracy), !is.na(log_violence), !is.na(percapitagdp))

nrow(qog_merged)    # all country-years
```

```
## [1] 1470
```

``` r
nrow(qog_analysis)  # complete cases used in both models
```

```
## [1] 1206
```

---
### Fit the Multivariate Model


``` r
model1 &lt;- lm(log_violence ~ democracy, data = qog_analysis)
model2 &lt;- lm(log_violence ~ democracy + I(log(percapitagdp)), data = qog_analysis)
summary(model2)
```

```
## 
## Call:
## lm(formula = log_violence ~ democracy + I(log(percapitagdp)), 
##     data = qog_analysis)
## 
## Residuals:
##     Min      1Q  Median      3Q     Max 
## -0.8250 -0.4951 -0.3259  0.1446  3.9542 
## 
## Coefficients:
##                      Estimate Std. Error t value Pr(&gt;|t|)    
## (Intercept)          -2.62822    0.43642  -6.022 2.28e-09 ***
## democracy             0.53541    0.20114   2.662  0.00787 ** 
## I(log(percapitagdp))  0.26060    0.04982   5.231 1.99e-07 ***
## ---
## Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1
## 
## Residual standard error: 0.8462 on 1203 degrees of freedom
## Multiple R-squared:  0.06287,	Adjusted R-squared:  0.06132 
## F-statistic: 40.36 on 2 and 1203 DF,  p-value: &lt; 2.2e-16
```

---

We use I(log(...)) to create the log transformation directly in the formula.

We re-fit `model1` on `qog_analysis` so that any change in the `log_violence` coefficient comes from adding the control, not from dropping observations.

---
### Compare Models


``` r
modelsummary(list("Bivariate" = model1, "Multivariate" = model2),
             statistic = "p.value", output = "gt", stars = TRUE) %&gt;%
  gt::gtsave(filename = "images\\regression_comparison_table.png")
```

---

&lt;img src="images/regression_comparison_table.png" width="40%" style="display: block; margin: auto;" /&gt;

**Discuss:**
