# Lab 2: Introduction to Regression in R

## Today's Goals

- Load and explore the ANES 2024 survey data
- Fit and interpret a **bivariate regression** (one predictor)
- Add a control variable and fit a **multivariate regression**
- Compare coefficients across models to assess confounding
- Connect these skills directly to Homework 2

---
class: inverse, center, middle

# Part 1: Loading and Exploring the ANES Data

---
### What Is the ANES?

The **American National Election Studies** (ANES) is one of the most important political surveys in the United States. It has been conducted around every presidential election since 1948.

The 2024 ANES interviewed U.S. adults before and after the election, asking about:
- Political attitudes and values
- Candidate evaluations
- Issue positions
- Emotions about politics
- Vote choice

---
### Load the Data


``` r
anes2024 &lt;- read.csv("https://raw.githubusercontent.com/jnseawright/ps210/refs/heads/main/Data/anes2024.csv")
```

---
### Examine the Raw Data


``` r
dim(anes2024)
```

```
## [1] 5521 1722
```


``` r
names(anes2024)[1:20]
```

```
##  [1] "version"      "V240001"      "V200001"      "V160001_orig" "V240002a"    
##  [6] "V240002b"     "V240002c"     "V240003"      "V240101a"     "V240101b"    
## [11] "V240101c"     "V240101d"     "V240102a"     "V240102b"     "V240102c"    
## [16] "V240102d"     "V240103a"     "V240103b"     "V240103c"     "V240103d"
```

The variable names are ANES codes (like `V241004`). We'll create a cleaner working dataset.

---
### Build a Working Dataset

We select only the variables we need and give them meaningful names.


``` r
aneshw &lt;- data.frame(
  politicalattention  = anes2024$V241004,
  corruption          = anes2024$V241233,
  economytrend        = anes2024$V241294x,
  angry               = anes2024$V241121,
  afraid              = anes2024$V241119,
  demrep              = anes2024$V241227x,
  trustgovernment     = anes2024$V241229,
  libcon              = anes2024$V241177,
  gender              = anes2024$V241551,
  presvote            = anes2024$V242067,
  democracyworks      = anes2024$V242439
)
```

---
### Clean the Data

ANES uses negative numbers for non-responses (refused, don't know, etc.). We recode these as missing.


``` r
aneshw &lt;- aneshw %&gt;%
  mutate(across(where(is.numeric), ~ ifelse(. &lt; 0, NA, .)))

# Recode presvote: keep only Harris (1) and Trump (2)
aneshw$presvote[aneshw$presvote &gt; 2] &lt;- NA
```

---
### Check the Outcome Variable

`presvote`: 1 = voted for Harris, 2 = voted for Trump.


``` r
table(aneshw$presvote)
```

```
## 
##    1    2 
## 2015 1588
```

**Question:** What does this distribution tell us? Does it match what you know about the 2024 election outcome?

---
### Check the Treatment Variable

`democracyworks`: "On the whole, are you very satisfied, fairly satisfied, not very satisfied, or not at all satisfied with the way democracy works in the United States?"

Scored 1 (very satisfied) to 5 (not at all satisfied) — so **higher = more concerns with democracy**.

---


``` r
table(aneshw$democracyworks)
```

```
## 
##    1    2    4    5 
##  449 2668 1272  287
```

**Question:** Where do most respondents fall? What would you predict about the relationship between this variable and vote choice?

# Part 2: Bivariate Regression

---
### Research Question

Does satisfaction with the functioning of American democracy predict presidential vote choice in 2024?

**Hypothesis:** Respondents who are less satisfied with American democracy are more likely to vote for Trump (the populist candidate who challenges the traditional functioning of the American system).

Since higher `democracyworks` scores = *less* satisfaction with democracy, we might expect:
- Higher scores → more likely to vote Trump (higher presvote)

---
### Visualize First

Always look before you model.


``` r
ggplot(aneshw, aes(x = democracyworks, y = presvote)) +
  geom_jitter(alpha = 0.1, width = 0.2, height = 0.1) +
  geom_smooth(method = "lm", color = "red") +
  labs(title = "Satisfaction with Democracy and Vote Choice (2024)",
       x = "Satisfaction with Democracy (1=high, 5=none)",
       y = "Vote choice (1=Harris, 2=Trump)") +
  theme_minimal()
```

![](StatisticalComputingLabSession2_files/figure-html/unnamed-chunk-9-1.png)&lt;!-- --&gt;

---
### Discuss the Plot

- What direction is the relationship?
- Does it look strong or weak?
- What are the limitations of this visualization?

---
### Fit the Bivariate Regression


``` r
model1 &lt;- lm(presvote ~ democracyworks, data = aneshw)
summary(model1)
```

```
## 
## Call:
## lm(formula = presvote ~ democracyworks, data = aneshw)
## 
## Residuals:
##     Min      1Q  Median      3Q     Max 
## -0.5297 -0.4708 -0.3529  0.5292  0.7061 
## 
## Coefficients:
##                Estimate Std. Error t value Pr(&gt;|t|)    
## (Intercept)     1.58869    0.02072  76.661  &lt; 2e-16 ***
## democracyworks -0.05896    0.00743  -7.935  2.8e-15 ***
## ---
## Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1
## 
## Residual standard error: 0.4919 on 3547 degrees of freedom
##   (1972 observations deleted due to missingness)
## Multiple R-squared:  0.01744,	Adjusted R-squared:  0.01716 
## F-statistic: 62.96 on 1 and 3547 DF,  p-value: 2.803e-15
```

---
### Read the Output

Key things to find:

- **Intercept**: predicted vote choice when democracyworks = 0 (not meaningful here)
- **Slope for `democracyworks`**: for a 1-unit decrease in democratic satisfaction, how does vote choice change?
- **p-value**: is this relationship statistically distinguishable from zero?

---
### A Cleaner Table


``` r
modelsummary(list("Bivariate" = model1),
             statistic = "p.value")
```

# Part 3: Multivariate Regression

---
### A Potential Confounder

Party identification (`demrep`) is measured on a 7-point scale from strong Democrat (1) to strong Republican (7).

It's plausibly a confounder: Republicans may both (a) be culturally more enthusiastic about America and (b) be more likely to vote for Trump.

If we don't control for it, the democratic satisfaction coefficient might just be capturing party ID.

---
### Check the Control Variable


``` r
table(aneshw$demrep)
```

```
## 
##    1    2    3    4    5    6    7 
## 1314  616  714  380  716  577 1166
```


``` r
# Is party ID related to both democratic satisfaction and vote choice?
cor(aneshw$demrep, aneshw$democracyworks, use = "complete.obs")
```

```
## [1] -0.108899
```


``` r
cor(aneshw$demrep, aneshw$presvote, use = "complete.obs")
```

```
## [1] 0.8426908
```

---
### What Did We Find?

- If `demrep` correlates with both `democracyworks` and `presvote`, it meets the definition of a confounder.
- What do the correlations suggest?

---
### Add the Control Variable


``` r
model2 &lt;- lm(presvote ~ democracyworks + demrep, data = aneshw)
summary(model2)
```

```

---
### Interpret the Comparison

**Key question:** How did the coefficient for `democracyworks` change after adding `demrep`?

- Did it get **closer to zero**? That suggests party ID was absorbing some of the apparent democratic satisfaction effect — it was a confounder.
- Did it stay **roughly the same**? That suggests the democratic satisfaction relationship holds even after accounting for party.
- Did it **grow or change sign**? That would be surprising and worth investigating further.

---
### Add a Second Control

Let's also add `politicalattention` — how much attention respondents say they pay to politics — as an additional control.


``` r
model3 &lt;- lm(presvote ~ democracyworks + demrep + politicalattention,
             data = aneshw)

modelsummary(list("Bivariate" = model1,
                  "Party ID" = model2,
                  "Full Controls" = model3),
             statistic = "p.value")
```
