### Today's Goals

By the end of this session, you should be able to:

1. Describe the main types of qualitative data and explain what each is best suited to study
2. Apply the method of difference and method of agreement to identify causal factors across cases
3. Distinguish theory-testing from theory-building process tracing and explain what each requires
4. Identify the main threats to causal inference in comparative case research
5. Explain the logic of case selection for process tracing

---
### Qualitative Methods

Looking at description and processes in *depth* instead of analyzing large data sets to achieve *breadth*.

---
### Types of Qualitative Data

-   Historical methods

-   In-depth interviews

-   Focus groups

-   Participant observation

### Comparative Case Studies

Can we structure the in-depth study of a few cases together to teach us more than we would get from studying each case in isolation?

---
### The Method of Difference

&gt; If an instance in which the phenomenon under investigation occurs, and
&gt; an instance in which it does not occur, have every circumstance in
&gt; common save one, that one occurring only in the former; the
&gt; circumstance in which alone the two instances differ is the effect, or
&gt; the cause, or an indispensable part of the cause, of the phenomenon.
&gt; (Mill 1843/2002)

### The Method of Difference

The key weakness: in a qualitative paired comparison, even small differences are enough to destabilize the comparison. We don't have an error term to absorb these!

---
### The Method of Agreement

Mill had other methods, less frequently used. One is the Method of Agreement, in which scholars study cases that have the same score on the outcome but are as different as possible in terms of circumstances. Then they search for commonalities to try to discern the cause.

* What are the weaknesses with this approach?

---
### Natural Experiments as Improved Method of Difference

Sometimes, a shock to a case can create before-after and cross-case comparisons that improve on the Method of Difference. We call these natural experiments.

### Process-Tracing I: Theory-Testing

---
![Section 1.1 introduction from Beach and Pedersen's process-tracing methodology text. Defines process-tracing as 'a research method for tracing causal mechanisms using detailed, within-case empirical analysis.' Identifies three core components: (1) theorization about causal mechanisms; (2) analysis of observable empirical manifestations of theorized mechanisms; (3) complementary use of comparative methods to select cases and generalize findings.](images/pt1.png)


---
![Table 1.1: Four Variants of Process-Tracing (Beach and Pedersen). Columns: Theory-testing (Is a hypothesized causal mechanism present?), Theory-building (What is the mechanism between cause and outcome?), Theoretical-revision (Why did the mechanism break down?), Explaining-outcome (What mechanistic explanation accounts for the historical outcome?). Theory-testing, theory-building, and theoretical-revision are theory-focused; explaining-outcome is case-focused.](images/pt2.png)

---
![Fig. 2.1 from Beach and Pedersen: 'Empirical narratives and the complete black-boxing of mechanisms.' Two-level diagram: the theoretical level shows Cause — ? — Outcome, with the mechanism unknown; the empirical level shows Empirical manifestation — event a, event b, event c — Empirical manifestation. The question mark illustrates that empirical narratives alone leave causal mechanisms unspecified.](images/pt3.png)
---
![Fig. 2.2 from Beach and Pedersen: 'A minimalist norms matter causal mechanism.' Three boxes: Cause (Taboo against use of nuclear weapons held by key participants in decision-making group) → Causal mechanism (Constraints imposed by individual decision-makers' personal moral convictions) → Outcome (Decision-makers take nuclear option off the table). A single-part minimal mechanism.](images/pt4.png)


---
![Fig. 2.3 from Beach and Pedersen: 'A two-part taboo talk causal mechanism' (based on Tannenwald 1999). Cause (nuclear use taboo) → Part 1: Believer in taboo uses the norm verbally to shame the proponent of use → Part 2: Proponent of use is unable to deploy a counterargument because it clashes with the taboo, thereby becomes silenced → Outcome: Decision-makers take the nuclear option off the table.](images/pt5.png)
---
### Process Tracing 2: Theory-Building

---
![Fig. 9.1 from Beach and Pedersen: 'The three steps of theory-building process-tracing.' Diagram with a theoretical level (top) and an empirical, case-specific level (bottom). Step 1 — Exploring the empirical record; Step 2 — Infer existence of fingerprints (empirical fingerprints for Parts 1 and 2 of the causal mechanism); Step 3 — Infer existence of the causal mechanism from the fingerprints. Shows how theory-building process-tracing moves inductively from raw empirical facts upward to theoretical claims about mechanisms.](images/theorybuildingpt.png)

### Example: Prasad on Reagan

Were Reagan's spending cuts based on economic analysis, conservative
ideology, or pragmatism?


---
![Excerpt from Prasad's process-tracing analysis of Reagan's budget cuts. Describes reliance on William Greider's interviews with David Stockman, director of the OMB, published in the Atlantic Monthly in December 1981 — 'an extraordinary document' giving Stockman's firsthand view of the budget-making process.](images/omb1.JPG)


---
![Excerpt from Prasad assessing the credibility of Greider's account of Stockman's revelations. Argues it meets high standards: Stockman confirmed Greider's quotations at a press conference, never disavowed them, and the political costs of his confessions were severe — nearly ending his political career.](images/omb2.JPG)


---
![Quote from Stockman cited in Prasad: 'None of us really understands what's going on with all these numbers. You've got so many different budgets out and so many different baselines and such complexity now in the interactive parts of the budget between policy action and the economic environment and all the internal mysteries of the budget, and there are a lot of them. People are getting from A to B and it's not clear how they are getting there' (Greider 1981, 38).](images/omb3.JPG)


---
![Excerpt from Prasad: Stockman repeatedly tried to cut politically protected programs and politicians repeatedly thwarted him. Reagan declared defense and universal programs (Social Security, Medicare) off-limits. Stockman wanted to cut the Export-Import Bank — 'how in the world can I cut food stamps... and you're going to tell me you can't give up one penny for Boeing?' — but a Republican Senator from a Boeing-beneficiary state reinstated the bank's subsidies.](images/omb4.JPG)

### Case Selection for Process Tracing

How do people choose cases for in-depth study? How *should* they choose cases to maximize learning?

---
### Case Selection for Process Tracing

According to Seawright and Gerring (2008), common approaches include choosing cases that are:

  * Typical: a case that fits an established theory well
  * Deviant: a case that is an especially poor fit for an established theory
  * Extreme: a case that has an unusually high or low value on the outcome or treatment variable
  * Influential: a case that substantially affects cross-case relationships when it is dropped from the data
  
---
### Case Selection for Process Tracing

In subsequent work, Seawright (2016) has argued that there is usually more to learn from deviant cases and cases that are extreme on the treatment variable than from others.

* Deviant cases are the ones that don't fit existing knowledge, so there is more to learn.

* Extreme cases on the treatment are ones where the causal path will be especially clear and easy to trace.

---
### Case Selection for Process Tracing

So when you're designing qualitative research, think about where the most leverage is. This will usually not be in the typical cases!

---
### Qualitative Methods: Key Takeaways

**1. Qualitative evidence takes many forms**
- Historical documents, in-depth interviews, focus groups, participant observation
- Each provides different kinds of insight into political processes

**2. Qualitative research is fundamentally about causal elaboration**
- Adding theoretical nuance and mechanism to quantitative findings
- Opening the "black box" between cause and effect

**3. Comparative case studies approximate experimental logic**
- Mill's methods provide an ideal, but perfect matching is impossible
- Natural experiments offer stronger comparisons when nature provides the shock

---

### Qualitative Methods: Key Takeaways

**4. Process-tracing designs within cases**
- Different kinds of designs pursue different aims
- Theory-testing, theory-building, theory-revising, and outcome-explaining process-tracing have different goals and typically different designs

**5. Case selection can help optimize our learning**
- Typical cases at best confirm what we already know
- Deviant and extreme cases teach us something new
- Choose cases for *leverage*, not convenience

**6. Qualitative methods aren't just broken quantitative research**
- They answer questions quantitative methods can't
- Description, mechanism, process, context all matter
